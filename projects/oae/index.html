<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="OAE Core case study by Bolaji Akande"><title>OAE Core | Bolaji Akande</title><style>body{margin:0;background:#06100c;color:#e8f1eb;font:16px Inter,system-ui,sans-serif;line-height:1.7}main{max-width:900px;margin:auto;padding:48px 22px}a{color:#8ff0c2}.k{font:11px monospace;letter-spacing:.12em;color:#8ff0c2;text-transform:uppercase}.card{border:1px solid #234534;border-radius:20px;padding:24px;margin:20px 0;background:#0a1710}.metric{font-size:28px;color:#8ff0c2;margin-right:18px}h1{font-size:clamp(38px,7vw,70px);line-height:1.05}.langs{position:fixed;right:16px;top:16px;background:#0a1710;color:white;border:1px solid #31543f;border-radius:999px;padding:8px}</style></head><body><select class="langs" id="l"><option value="en">EN</option><option value="fr">FR</option><option value="es">ES</option><option value="pt">PT</option><option value="it">IT</option><option value="de">DE</option><option value="ar">عربي</option><option value="yo">YO</option></select><main><a href="/">← <span data-k="back">Bolaji Akande</span></a><p class="k" data-k="label"></p><h1>OAE Core</h1><p data-k="intro"></p><div class="card"><h2 data-k="problemH"></h2><p data-k="problem"></p></div><div class="card"><h2 data-k="archH"></h2><p data-k="arch"></p></div><div class="card"><h2 data-k="missionH"></h2><p data-k="mission"></p></div><div class="card"><h2 data-k="proofH"></h2><p data-k="proof"></p></div></main><script>const D={"en":{"label":"Case study · autonomous engineering","intro":"A governed engineering control plane for repositories, workspaces, jobs and controlled execution. OAE is designed around a simple idea: non-coders should be able to express intent and drive serious software work without losing human authority.","problemH":"The problem","problem":"Most software tools expose capabilities, not outcomes. OAE treats engineering as a governed execution loop: understand intent, inspect context, plan, execute through controlled tools, verify and preserve evidence.","archH":"Architecture","arch":"The architecture is deliberately evidence-driven. Generated code is not considered complete until the system can build, test, inspect and verify the result.","missionH":"Current mission","mission":"Move OAE from a static interface toward a real command surface where users can communicate through text, images, voice and documents, while execution remains controlled and observable.","proofH":"Engineering thesis","proof":"Autonomy should expand capability, not silently take authority. Durable execution, verification, auditability and recovery are part of the product."},"fr":{"label":"Étude de cas · ingénierie autonome","intro":"Un plan de contrôle d’ingénierie gouverné pour les dépôts, espaces de travail, tâches et exécutions contrôlées. OAE permet d’exprimer une intention et de piloter un travail logiciel sérieux sans perdre l’autorité humaine.","problemH":"Le problème","problem":"La plupart des outils exposent des capacités, pas des résultats. OAE traite l’ingénierie comme une boucle d’exécution gouvernée : comprendre, examiner le contexte, planifier, exécuter avec des outils contrôlés, vérifier et conserver les preuves.","archH":"Architecture","arch":"L’architecture est volontairement fondée sur les preuves. Le code généré n’est pas considéré comme terminé avant que le système puisse construire, tester, inspecter et vérifier le résultat.","missionH":"Mission actuelle","mission":"Faire passer OAE d’une interface statique à une véritable surface de commande où les utilisateurs peuvent communiquer par texte, images, voix et documents, avec une exécution contrôlée et observable.","proofH":"Thèse d’ingénierie","proof":"L’autonomie doit accroître les capacités sans prendre silencieusement l’autorité. Exécution durable, vérification, auditabilité et récupération font partie du produit."},"es":{"label":"Caso de estudio · ingeniería autónoma","intro":"Una plataforma de control de ingeniería gobernada para repositorios, espacios de trabajo, tareas y ejecución controlada. OAE permite expresar una intención y dirigir trabajo de software serio sin perder la autoridad humana.","problemH":"El problema","problem":"La mayoría de las herramientas exponen capacidades, no resultados. OAE trata la ingeniería como un ciclo de ejecución gobernado: comprender la intención, revisar el contexto, planificar, ejecutar con herramientas controladas, verificar y conservar evidencias.","archH":"Arquitectura","arch":"La arquitectura está diseñada alrededor de evidencias. El código generado no se considera terminado hasta que el sistema puede compilar, probar, inspeccionar y verificar el resultado.","missionH":"Misión actual","mission":"Llevar OAE de una interfaz estática a una verdadera superficie de comandos donde los usuarios puedan comunicarse mediante texto, imágenes, voz y documentos, manteniendo la ejecución controlada y observable.","proofH":"Tesis de ingeniería","proof":"La autonomía debe ampliar las capacidades sin asumir silenciosamente la autoridad. La ejecución duradera, la verificación, la auditabilidad y la recuperación forman parte del producto."},"pt":{"label":"Estudo de caso · engenharia autônoma","intro":"Uma plataforma de controle de engenharia governada para repositórios, espaços de trabalho, tarefas e execução controlada. OAE permite expressar uma intenção e conduzir trabalho de software sério sem perder a autoridade humana.","problemH":"O problema","problem":"A maioria das ferramentas expõe capacidades, não resultados. OAE trata a engenharia como um ciclo de execução governado: entender a intenção, analisar o contexto, planejar, executar com ferramentas controladas, verificar e preservar evidências.","archH":"Arquitetura","arch":"A arquitetura é deliberadamente orientada por evidências. Código gerado não é considerado concluído até que o sistema possa compilar, testar, inspecionar e verificar o resultado.","missionH":"Missão atual","mission":"Levar o OAE de uma interface estática para uma verdadeira superfície de comandos onde usuários possam comunicar-se por texto, imagens, voz e documentos, mantendo a execução controlada e observável.","proofH":"Tese de engenharia","proof":"A autonomia deve ampliar capacidades sem assumir silenciosamente a autoridade. Execução durável, verificação, auditabilidade e recuperação fazem parte do produto."},"ar":{"label":"دراسة حالة · هندسة برمجية مستقلة","intro":"منصة تحكم هندسية محكومة للمستودعات ومساحات العمل والمهام والتنفيذ المنضبط. يتيح OAE التعبير عن النية وقيادة أعمال برمجية جادة مع الحفاظ على سلطة الإنسان.","problemH":"المشكلة","problem":"معظم الأدوات تعرض القدرات وليس النتائج. يتعامل OAE مع الهندسة كدورة تنفيذ محكومة: فهم النية، فحص السياق، التخطيط، التنفيذ بأدوات مضبوطة، التحقق وحفظ الأدلة.","archH":"البنية المعمارية","arch":"البنية مصممة حول الأدلة. لا يُعتبر الكود المُولّد مكتملاً حتى يتمكن النظام من البناء والاختبار والفحص والتحقق من النتيجة.","missionH":"المهمة الحالية","mission":"نقل OAE من واجهة ثابتة إلى سطح أوامر حقيقي يمكن للمستخدمين من خلاله التواصل بالنص والصور والصوت والمستندات مع بقاء التنفيذ منضبطاً وقابلاً للمراقبة.","proofH":"الأطروحة الهندسية","proof":"يجب أن توسّع الاستقلالية القدرات دون أن تستولي بصمت على سلطة البشر. التنفيذ المتين والتحقق وقابلية التدقيق والاستعادة جزء من المنتج."},"yo":{"label":"Àpẹẹrẹ iṣẹ́ · iṣẹ́ ẹ̀rọ aládàáṣiṣẹ́","intro":"Pẹpẹ iṣakoso iṣẹ́ ẹ̀rọ tó ní ìṣàkóso fún repositories, workspaces, iṣẹ́ àti execution tó wà lábẹ́ ìṣàkóso. OAE ń jẹ́ kí ènìyàn sọ ohun tí ó fẹ́ kí a ṣe, kí iṣẹ́ sọfitiwia gidi sì tẹ̀síwájú láìpadanu àṣẹ ènìyàn.","problemH":"Ìṣòro náà","problem":"Ọ̀pọ̀ irinṣẹ́ ń fi agbára hàn, kì í ṣe àbájáde. OAE ń wo engineering gẹ́gẹ́ bí yípo iṣẹ́ tó ní ìṣàkóso: lóye ìfẹ́, ṣàyẹ̀wò context, gbero, ṣe pẹ̀lú irinṣẹ́ tó ní ìṣàkóso, ṣàyẹ̀wò àbájáde àti pa ẹ̀rí mọ́.","archH":"Ìṣètò","arch":"A kọ́ architecture náà lórí ẹ̀rí. Koodu tí a ṣe kò jẹ́ pé ó parí títí tí eto náà fi lè build, test, inspect àti verify àbájáde.","missionH":"Iṣẹ́ tó ń lọ","mission":"Gbé OAE láti interface tó dúró sílẹ̀ sí command surface gidi tí ènìyàn lè lò pẹ̀lú text, aworan, ohùn àti documents, nígbà tí execution ń jẹ́ controlled àti observable.","proofH":"Ìlànà engineering","proof":"Autonomy gbọ́dọ̀ mú agbára pọ̀ síi láì gba àṣẹ ènìyàn ní ìkọ̀kọ̀. Durable execution, verification, auditability àti recovery jẹ́ apá ọja náà."}};const l=document.getElementById("l");function set(x){document.documentElement.lang=x;document.documentElement.dir=x==="ar"?"rtl":"ltr";document.querySelectorAll("[data-k]").forEach(e=>{const v=(D[x]||D.en)[e.dataset.k];if(v)e.textContent=v});l.value=x;localStorage.setItem("portfolio-language",x)}const saved=localStorage.getItem("portfolio-language")||"en";l.onchange=()=>set(l.value);set(saved);</script></body></html>
