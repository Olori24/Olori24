<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="ClinicOS case study by Bolaji Akande"><title>ClinicOS | Bolaji Akande</title><style>body{margin:0;background:#06100c;color:#e8f1eb;font:16px Inter,system-ui,sans-serif;line-height:1.7}main{max-width:900px;margin:auto;padding:48px 22px}a{color:#8ff0c2}.k{font:11px monospace;letter-spacing:.12em;color:#8ff0c2;text-transform:uppercase}.card{border:1px solid #234534;border-radius:20px;padding:24px;margin:20px 0;background:#0a1710}.metric{font-size:28px;color:#8ff0c2;margin-right:18px}h1{font-size:clamp(38px,7vw,70px);line-height:1.05}.langs{position:fixed;right:16px;top:16px;background:#0a1710;color:white;border:1px solid #31543f;border-radius:999px;padding:8px}</style></head><body><select class="langs" id="l"><option value="en">EN</option><option value="fr">FR</option><option value="es">ES</option><option value="pt">PT</option><option value="it">IT</option><option value="de">DE</option><option value="ar">عربي</option><option value="yo">YO</option></select><main><a href="/">← <span data-k="back">Bolaji Akande</span></a><p class="k" data-k="label"></p><h1>ClinicOS</h1><p data-k="intro"></p><div class="card"><span class="metric">603+</span><span class="metric">41 E2E</span><span class="metric">21/21</span><p data-k="metrics"></p></div><div class="card"><h2 data-k="metrics"></h2><p data-k="metrics"></p></div><div class="card"><h2 data-k="problemH"></h2><p data-k="problem"></p></div><div class="card"><h2 data-k="proofH"></h2><p data-k="proof"></p></div><div class="card"><h2 data-k="thesisH"></h2><p data-k="thesis"></p></div></main><script>const D={"it":["Caso di studio · sistema operativo sanitario","Un sistema clinico multi-tenant basato sull’IA per pazienti, visite, laboratorio, farmacia, fatturazione, inventario, personale, sicurezza e auditabilità.","Il problema","Il software clinico spesso frammenta i workflow medici e operativi. ClinicOS tratta la clinica come un unico ambiente operativo multi-tenant con workflow basati sui ruoli, controlli di sicurezza e audit trail.","Verifica","L’hardening del rilascio ha incluso verifica indipendente e correzioni di difetti specifici PostgreSQL. Il branch principale ha raggiunto una base verde con typecheck, lint, build, smoke ed E2E browser.","Tesi ingegneristica","Il software sanitario deve essere utile operativamente e responsabile tecnicamente. Sicurezza, isolamento dei tenant, auditabilità e verifica appartengono al sistema centrale.","Base ingegneristica verificata: oltre 603 test, 41 test E2E reali con Chromium e 21/21 smoke check."],"de":["Fallstudie · Gesundheitsbetriebssystem","Ein KI-gestütztes mandantenfähiges Klinikbetriebssystem für Patienten, Behandlungen, Labor, Apotheke, Abrechnung, Inventar, Personal, Sicherheit und Auditierbarkeit.","Das Problem","Kliniksoftware fragmentiert häufig medizinische und operative Workflows. ClinicOS behandelt die Klinik als eine mandantenfähige Betriebsumgebung mit rollenbasierten Workflows, Sicherheitskontrollen und Audit-Protokollen.","Verifizierung","Das Release-Hardening umfasste unabhängige Verifizierung und die Behebung PostgreSQL-spezifischer Fehler. Der Main-Branch erreichte eine grüne Basis mit Typecheck, Lint, Build, Smoke und Browser-E2E.","Engineering-These","Gesundheitssoftware muss operativ nützlich und technisch verantwortbar sein. Sicherheit, Mandantentrennung, Auditierbarkeit und Verifizierung gehören in das Kernsystem.","Verifizierte Engineering-Basis: 603+ Tests, 41 echte Chromium-E2E-Tests und 21/21 Smoke Checks."]};const D0={"en":{"label":"Case study · healthcare operating system","intro":"An AI-powered, multi-tenant clinic operating system covering patients, encounters, laboratory, pharmacy, billing, inventory, staff, security and auditability.","metrics":"Verified engineering baseline: 603+ tests, 41 real Chromium end-to-end tests and 21/21 smoke checks.","problemH":"The problem","problem":"Clinic software often fragments clinical and operational workflows. ClinicOS treats the clinic as one multi-tenant operating environment with role-aware workflows, security controls and audit trails.","proofH":"Verification","proof":"Release hardening included independent verification and PostgreSQL-specific defect fixes. The main branch reached a green baseline with typecheck, lint, build, smoke and browser E2E verification.","thesisH":"Engineering thesis","thesis":"Healthcare software must be operationally useful and technically accountable. Security, tenant isolation, auditability and verification belong in the core system."},"fr":{"label":"Étude de cas · système d’exploitation de santé","intro":"Un système clinique multi-tenant alimenté par l’IA couvrant patients, consultations, laboratoire, pharmacie, facturation, inventaire, personnel, sécurité et auditabilité.","problemH":"Le problème","problem":"Les logiciels cliniques fragmentent souvent les workflows médicaux et opérationnels. ClinicOS traite la clinique comme un environnement opérationnel multi-tenant avec workflows par rôle, contrôles de sécurité et pistes d’audit.","archH":"Vérification","arch":"Le durcissement de la version a inclus une vérification indépendante et la correction de défauts spécifiques à PostgreSQL. La branche principale a atteint une base verte avec typecheck, lint, build, smoke et E2E navigateur.","missionH":"Thèse d’ingénierie","mission":"Les logiciels de santé doivent être utiles opérationnellement et responsables techniquement. Sécurité, isolation des tenants, auditabilité et vérification appartiennent au système central.","proofH":"Base d’ingénierie vérifiée : 603+ tests, 41 tests E2E Chromium réels et 21/21 contrôles smoke."},"es":{"label":"Caso de estudio · sistema operativo sanitario","intro":"Un sistema clínico multiinquilino impulsado por IA que cubre pacientes, consultas, laboratorio, farmacia, facturación, inventario, personal, seguridad y auditoría.","problemH":"El problema","problem":"El software clínico suele fragmentar los flujos médicos y operativos. ClinicOS trata la clínica como un entorno operativo multiinquilino con flujos por rol, controles de seguridad y registros de auditoría.","archH":"Verificación","arch":"La preparación de la versión incluyó verificación independiente y correcciones de defectos específicos de PostgreSQL. La rama principal alcanzó una base verde con typecheck, lint, build, smoke y E2E en navegador.","missionH":"Tesis de ingeniería","mission":"El software sanitario debe ser útil operativamente y responsable técnicamente. La seguridad, el aislamiento de inquilinos, la auditoría y la verificación pertenecen al sistema central.","proofH":"Base de ingeniería verificada: 603+ pruebas, 41 pruebas E2E reales con Chromium y 21/21 comprobaciones smoke."},"pt":{"label":"Estudo de caso · sistema operacional de saúde","intro":"Um sistema clínico multi-tenant alimentado por IA que cobre pacientes, atendimentos, laboratório, farmácia, faturamento, inventário, equipe, segurança e auditabilidade.","problemH":"O problema","problem":"O software clínico frequentemente fragmenta os fluxos médicos e operacionais. O ClinicOS trata a clínica como um ambiente operacional multi-tenant com fluxos por função, controles de segurança e trilhas de auditoria.","archH":"Verificação","arch":"O endurecimento da versão incluiu verificação independente e correções de defeitos específicos do PostgreSQL. A branch principal alcançou uma base verde com typecheck, lint, build, smoke e E2E no navegador.","missionH":"Tese de engenharia","mission":"Software de saúde precisa ser útil operacionalmente e responsável tecnicamente. Segurança, isolamento de tenants, auditabilidade e verificação pertencem ao sistema central.","proofH":"Base de engenharia verificada: 603+ testes, 41 testes E2E reais com Chromium e 21/21 verificações smoke."},"ar":{"label":"دراسة حالة · نظام تشغيل للرعاية الصحية","intro":"نظام سريري متعدد المستأجرين مدعوم بالذكاء الاصطناعي يغطي المرضى والزيارات والمختبر والصيدلية والفوترة والمخزون والموظفين والأمان وقابلية التدقيق.","problemH":"المشكلة","problem":"غالباً ما تقسم برمجيات العيادات سير العمل الطبي والتشغيلي. يتعامل ClinicOS مع العيادة كبيئة تشغيل متعددة المستأجرين مع تدفقات حسب الدور وضوابط أمنية وسجلات تدقيق.","archH":"التحقق","arch":"شمل تجهيز الإصدار تحققاً مستقلاً وإصلاح عيوب خاصة بـ PostgreSQL. وصل الفرع الرئيسي إلى أساس أخضر مع typecheck وlint وbuild وsmoke واختبارات E2E في المتصفح.","missionH":"الأطروحة الهندسية","mission":"يجب أن تكون برمجيات الرعاية الصحية مفيدة تشغيلياً ومسؤولة تقنياً. الأمان وعزل المستأجرين وقابلية التدقيق والتحقق جزء من النظام الأساسي.","proofH":"خط أساس هندسي متحقق: أكثر من 603 اختبار، و41 اختبار E2E حقيقياً عبر Chromium، و21/21 فحص smoke."},"yo":{"label":"Àpẹẹrẹ iṣẹ́ · eto iṣakoso ilera","intro":"Eto ile-iwosan multi-tenant tí AI ń ṣe iranlọwọ fún aláìsàn, ìbẹ̀wò, laboratory, pharmacy, billing, inventory, workers, security àti auditability.","problemH":"Ìṣòro náà","problem":"Clinic software máa ń pín medical àti operational workflows sí ọ̀pọ̀ ibi. ClinicOS ń wo clinic gẹ́gẹ́ bí environment multi-tenant kan pẹ̀lú workflows tó dá lórí role, security controls àti audit trails.","archH":"Ìṣàyẹ̀wò","arch":"Release hardening ní independent verification àti àtúnṣe àwọn aṣiṣe PostgreSQL. Main branch dé baseline green pẹ̀lú typecheck, lint, build, smoke àti browser E2E.","missionH":"Ìlànà engineering","mission":"Health software gbọ́dọ̀ wúlò fún iṣẹ́ gidi àti jẹ́ accountable ní imọ̀ ẹ̀rọ. Security, tenant isolation, auditability àti verification jẹ́ apá core system.","proofH":"Ẹ̀rí engineering tó jẹ́rìí: 603+ tests, 41 Chromium E2E gidi àti 21/21 smoke checks."}};const l=document.getElementById("l");function set(x){document.documentElement.lang=x;document.documentElement.dir=x==="ar"?"rtl":"ltr";document.querySelectorAll("[data-k]").forEach(e=>{const v=((D[x]||D0[x]||D0.en))[e.dataset.k];if(v)e.textContent=v});l.value=x;localStorage.setItem("portfolio-language",x)}const saved=localStorage.getItem("portfolio-language")||"en";l.onchange=()=>set(l.value);set(saved);</script></body></html>
