<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="NSOS case study by Bolaji Akande"><title>NSOS | Bolaji Akande</title><style>body{margin:0;background:#06100c;color:#e8f1eb;font:16px Inter,system-ui,sans-serif;line-height:1.7}main{max-width:900px;margin:auto;padding:48px 22px}a{color:#8ff0c2}.k{font:11px monospace;letter-spacing:.12em;color:#8ff0c2;text-transform:uppercase}.card{border:1px solid #234534;border-radius:20px;padding:24px;margin:20px 0;background:#0a1710}.metric{font-size:28px;color:#8ff0c2;margin-right:18px}h1{font-size:clamp(38px,7vw,70px);line-height:1.05}.langs{position:fixed;right:16px;top:16px;background:#0a1710;color:white;border:1px solid #31543f;border-radius:999px;padding:8px}</style></head><body><select class="langs" id="l"><option value="en">EN</option><option value="fr">FR</option><option value="es">ES</option><option value="pt">PT</option><option value="it">IT</option><option value="de">DE</option><option value="ar">عربي</option><option value="yo">YO</option></select><main><a href="/">← <span data-k="back">Bolaji Akande</span></a><p class="k" data-k="label"></p><h1>NSOS</h1><p data-k="intro"></p><div class="card"><h2 data-k="problemH"></h2><p data-k="problem"></p></div><div class="card"><h2 data-k="productH"></h2><p data-k="product"></p></div><div class="card"><h2 data-k="futureH"></h2><p data-k="future"></p></div></main><script>const D0={"it":["Caso di studio · sistema operativo per l’istruzione","Un sistema operativo pensato prima di tutto per la Nigeria, che riunisce amministrazione, apprendimento, comunicazione, pagamenti e assistenza IA in un unico livello operativo.","Il problema","Le operazioni scolastiche sono spesso distribuite tra strumenti, fogli di calcolo e canali di comunicazione. NSOS è progettato come un unico livello operativo per gli istituti, con una base multi-tenant e una direzione di espansione in Africa.","Tesi di prodotto","Il software scolastico serio dovrebbe essere accessibile senza richiedere a ogni istituto di assemblare uno stack tecnologico complesso. NSOS mira a riunire onboarding, amministrazione, workflow di apprendimento e assistenza IA.","Direzione","La piattaforma si sta sviluppando attorno all’onboarding degli istituti, tutor e dipendenti IA, comunicazioni, pagamenti e operazioni scolastiche durevoli, mantenendo la configurazione sotto l’autorità degli istituti."],"de":["Fallstudie · Bildungsbetriebssystem","Ein zuerst für Nigeria entwickeltes Betriebssystem für Schulen und Bildungseinrichtungen, das Verwaltung, Lernen, Kommunikation, Zahlungen und KI-Unterstützung in einer operativen Ebene verbindet.","Das Problem","Schulabläufe sind oft auf verschiedene Tools, Tabellen und Kommunikationskanäle verteilt. NSOS ist als eine operative Ebene für Einrichtungen konzipiert, mit mandantenfähiger Grundlage und Ausrichtung auf eine Expansion in Afrika.","Produkt-These","Professionelle Schulsoftware sollte zugänglich sein, ohne dass jede Einrichtung einen komplexen Technologie-Stack zusammenstellen muss. NSOS soll Onboarding, Verwaltung, Lern-Workflows und KI-Unterstützung in einem System vereinen.","Ausrichtung","Die Plattform entwickelt sich rund um Einrichtungs-Onboarding, KI-Tutoren und KI-Mitarbeiter, Kommunikation, Zahlungen und dauerhafte Schulabläufe, während die Konfiguration unter der Kontrolle der Einrichtungen bleibt."]};const D0={"en":{"label":"Case study · education operating system","intro":"A Nigeria-first operating system for schools and learning institutions, bringing administration, learning, communication, payments and AI assistance into one operational layer.","problemH":"The problem","problem":"School operations are often scattered across disconnected tools, spreadsheets and communication channels. NSOS is designed as a single operational layer for institutions, with multi-tenant foundations and room for Africa-wide expansion.","productH":"Product thesis","product":"Serious school software should be accessible without requiring every institution to assemble a complex technology stack. NSOS aims to make onboarding, administration, learning workflows and AI assistance part of one system.","futureH":"Direction","future":"The platform is being shaped around institution onboarding, AI tutors and employees, communications, payments and durable school operations while keeping configuration under institutional authority."},"fr":{"label":"Étude de cas · système d’exploitation éducatif","intro":"Un système d’exploitation conçu d’abord pour le Nigeria, réunissant administration, apprentissage, communication, paiements et assistance IA dans une couche opérationnelle.","problemH":"Le problème","problem":"Les opérations scolaires sont souvent dispersées entre outils, feuilles de calcul et canaux de communication. NSOS est conçu comme une couche opérationnelle unique pour les établissements, avec une base multi-tenant et une ambition d’expansion en Afrique.","archH":"Thèse produit","arch":"Les logiciels scolaires sérieux devraient être accessibles sans obliger chaque établissement à assembler une stack technologique complexe. NSOS vise à réunir onboarding, administration, workflows d’apprentissage et assistance IA.","missionH":"Direction","mission":"La plateforme évolue autour de l’intégration des établissements, des tuteurs et employés IA, des communications, des paiements et des opérations scolaires durables, tout en gardant la configuration sous l’autorité des établissements."},"es":{"label":"Caso de estudio · sistema operativo educativo","intro":"Un sistema operativo diseñado primero para Nigeria que reúne administración, aprendizaje, comunicación, pagos y asistencia de IA en una sola capa operativa.","problemH":"El problema","problem":"Las operaciones escolares suelen estar dispersas entre herramientas, hojas de cálculo y canales de comunicación. NSOS se diseña como una capa operativa única para las instituciones, con una base multiinquilino y una dirección de expansión africana.","archH":"Tesis de producto","arch":"El software escolar serio debe ser accesible sin obligar a cada institución a ensamblar una pila tecnológica compleja. NSOS busca reunir incorporación, administración, flujos de aprendizaje y asistencia de IA.","missionH":"Dirección","mission":"La plataforma evoluciona alrededor de la incorporación de instituciones, tutores y empleados de IA, comunicaciones, pagos y operaciones escolares duraderas, manteniendo la configuración bajo autoridad institucional."},"pt":{"label":"Estudo de caso · sistema operacional educacional","intro":"Um sistema operacional criado primeiro para a Nigéria, reunindo administração, aprendizagem, comunicação, pagamentos e assistência de IA em uma única camada operacional.","problemH":"O problema","problem":"As operações escolares costumam estar espalhadas entre ferramentas, planilhas e canais de comunicação. O NSOS é projetado como uma camada operacional única para instituições, com base multi-tenant e direção de expansão africana.","archH":"Tese do produto","arch":"Software escolar sério deve ser acessível sem exigir que cada instituição monte uma stack tecnológica complexa. O NSOS busca reunir onboarding, administração, fluxos de aprendizagem e assistência de IA.","missionH":"Direção","mission":"A plataforma está sendo desenvolvida em torno do onboarding institucional, tutores e funcionários de IA, comunicações, pagamentos e operações escolares duráveis, mantendo a configuração sob autoridade da instituição."},"ar":{"label":"دراسة حالة · نظام تشغيل للتعليم","intro":"نظام تشغيل مصمم أولاً لنيجيريا يجمع الإدارة والتعلم والتواصل والمدفوعات ومساعدة الذكاء الاصطناعي في طبقة تشغيلية واحدة.","problemH":"المشكلة","problem":"غالباً ما تكون العمليات المدرسية موزعة بين الأدوات وجداول البيانات وقنوات الاتصال. صُمم NSOS كطبقة تشغيل واحدة للمؤسسات، مع أساس متعدد المستأجرين واتجاه للتوسع في أفريقيا.","archH":"أطروحة المنتج","arch":"يجب أن تكون برمجيات المدارس الجادة متاحة دون إجبار كل مؤسسة على بناء حزمة تقنية معقدة. يهدف NSOS إلى جمع التسجيل والإدارة وتدفقات التعلم ومساعدة الذكاء الاصطناعي في نظام واحد.","missionH":"الاتجاه","mission":"تتطور المنصة حول تسجيل المؤسسات، والمدرسين والموظفين المدعومين بالذكاء الاصطناعي، والاتصالات والمدفوعات والعمليات المدرسية المتينة، مع بقاء الإعداد تحت سلطة المؤسسة."},"yo":{"label":"Àpẹẹrẹ iṣẹ́ · eto iṣakoso ẹ̀kọ́","intro":"Eto iṣakoso tí a kọ́kọ́ ṣe fún Nigeria, tó ń kó administration, learning, communication, payments àti AI assistance jọ sínú operational layer kan.","problemH":"Ìṣòro náà","problem":"School operations sábà ń tàn káàkiri tools, spreadsheets àti communication channels. NSOS jẹ́ layer kan ṣoṣo fún institutions, pẹ̀lú multi-tenant foundation àti ète láti gbooro sí Africa.","archH":"Ìlànà ọja","arch":"School software tó ṣe pataki gbọ́dọ̀ rọrùn láti wọlé láì jẹ́ kí institution kọọkan kọ́ technology stack tó nira. NSOS ń fẹ́ kó onboarding, administration, learning workflows àti AI assistance jọ.","missionH":"Ìtọ́sọ́nà","mission":"Platform náà ń lọ sí institution onboarding, AI tutors àti AI employees, communications, payments àti durable school operations, nígbà tí institution bá ń ṣàkóso configuration rẹ̀."}};const keys=["label","intro","problemH","problem","productH","product","futureH","future"];const D=Object.fromEntries(Object.entries(D0).map(([lang,a])=>[lang,Object.fromEntries(keys.map((k,i)=>[k,a[i]]))]));;const l=document.getElementById("l");function set(x){document.documentElement.lang=x;document.documentElement.dir=x==="ar"?"rtl":"ltr";document.querySelectorAll("[data-k]").forEach(e=>{const v=((D[x]||D.en))[e.dataset.k];if(v)e.textContent=v});l.value=x;localStorage.setItem("portfolio-language",x)}const saved=localStorage.getItem("portfolio-language")||"en";l.onchange=()=>set(l.value);set(saved);</script></body></html>
