name: Refresh portfolio signal

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate live portfolio graphic
        run: node .github/scripts/generate-portfolio-signal.mjs
      - name: Commit refreshed signal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/live-portfolio.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh portfolio signal"
          git push
